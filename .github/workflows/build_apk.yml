name: Build SmartExam APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Extract Flutter project
        run: |
          unzip -q SmartExam_fixed.zip -d extracted
          test -f extracted/SmartExam_fixed/pubspec.yaml
          test -d extracted/SmartExam_fixed/android

      - name: Install Android SDK 36
        run: |
          yes | sdkmanager --licenses || true
          sdkmanager "platforms;android-36" "build-tools;35.0.0"

      - name: Set compileSdk to 36
        working-directory: extracted/SmartExam_fixed
        run: |
          find android -type f \( -name "*.gradle" -o -name "*.gradle.kts" \) -print0 | \
          xargs -0 sed -i \
          -e 's/compileSdkVersion[[:space:]]*34/compileSdkVersion 36/g' \
          -e 's/compileSdk[[:space:]]*=[[:space:]]*34/compileSdk = 36/g'

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Get dependencies
        working-directory: extracted/SmartExam_fixed
        run: flutter pub get

      - name: Build APK
        working-directory: extracted/SmartExam_fixed
        run: flutter build apk --release

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: SmartExam-APK
          path: extracted/SmartExam_fixed/build/app/outputs/flutter-apk/app-release.apk
